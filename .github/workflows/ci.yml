name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Shop.slnx

      - name: Build (Release)
        run: dotnet build Shop.slnx --no-restore -c Release

      # مایگریشن‌ها در استارت‌آپ برنامه اعمال می‌شوند؛ این مرحله فقط صحت بیلد را تضمین می‌کند
      - name: Publish check
        run: dotnet publish src/Shop.Presentation/Shop.Presentation.csproj -c Release -o ./publish --no-build
