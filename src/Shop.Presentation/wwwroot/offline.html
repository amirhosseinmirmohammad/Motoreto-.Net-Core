<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آفلاین — فروشگاه شاپ</title>
    <style>
        body {
            font-family: Vazirmatn, Tahoma, sans-serif;
            background: #f6f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #23254e;
        }
        .box { text-align: center; padding: 2rem; }
        .icon { font-size: 4rem; }
        h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
        p { color: #8b8d9f; font-size: .95rem; }
        button {
            background: #ef4056; color: #fff; border: none;
            padding: .7rem 2rem; border-radius: 12px;
            font-family: inherit; font-size: 1rem; cursor: pointer;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>اتصال اینترنت قطع است!</h1>
        <p>صفحات بازدیدشده اخیر در دسترس هستند.<br />وقتی اینترنت وصل شد، دوباره تلاش کنید.</p>
        <button onclick="location.reload()">تلاش مجدد</button>
    </div>
</body>
</html>
